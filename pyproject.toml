[project]
name = "cs156-ml"
version = "0.1.0"
description = "CS156 Machine Learning coursework: notebooks, reusable code, and LLM conversation logs"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "jupyterlab",
    "ipykernel",
    "nbstripout",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "torch>=2.14.1",
    "pyarrow>=26.0.0",
    "opencv-python-headless>=5.0.0.93",
    "rank-bm25>=0.2.2",
    "wordfreq>=3.1.1",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    "setfit>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs156", "pipeline1/oncue"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
