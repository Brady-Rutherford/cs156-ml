[project]
name = "cs156-ml"
version = "0.1.0"
description = "CS156 Machine Learning coursework: notebooks, reusable code, and LLM conversation logs"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "jupyterlab",
    "ipykernel",
    "nbstripout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs156"]
